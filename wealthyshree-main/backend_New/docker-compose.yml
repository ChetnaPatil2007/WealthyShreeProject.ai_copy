services:
  db:
    image: postgres:16
    container_name: backend_New
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealth
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wealthsphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: